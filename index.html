<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
  </head>

  <body>
    <div class="container">
      <header class="app-header">
        <span class="app-icon" aria-hidden="true">
  <svg class="app-emoji" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="9"></circle>
    <path d="M12 7v5l3 2"></path>
  </svg>
</span>

        <h1 class="app-title">World Clock</h1>
      </header>

      <main class="app">
        <section class="hero-card" aria-labelledby="local-time-heading">
          <h2 id="local-time-heading" class="visually-hidden">Local time</h2>
          <p class="local-time-label">Your local time</p>
          <p class="local-timezone" id="local-timezone"></p>

          <div class="time-row">
            <time class="local-time" id="local-time"></time>
            <span class="am-pm" id="am-pm"></span>
          </div>

          <time class="date" id="local-date"></time>
        </section>

        <section class="picker" aria-labelledby="choose-city-heading">
          <h2 id="choose-city-heading" class="visually-hidden">
            Choose a city
          </h2>
          <div class="picker-card">
            <label class="visually-hidden" for="city-select"
              >Choose a city</label
            >
            <select class="city-select" id="city-select">
              <option value="">Select a city...</option>
              <option value="Europe/London">🇬🇧 London</option>
              <option value="Europe/Dublin">🇮🇪 Dublin</option>
              <option value="Europe/Athens">🇬🇷 Rhodes</option>
              <option value="Europe/Amsterdam">🇳🇱 Amsterdam</option>
              <option value="America/Barbados">🇧🇧 Bridgetown</option>
            </select>
          </div>
        </section>

        <section class="cards" aria-labelledby="world-clocks-heading">
          <h2 id="world-clocks-heading" class="visually-hidden">
            World clocks
          </h2>
          <article
            class="city-card"
            id="london-card"
            data-timezone="Europe/London"
          >
            <div class="city-card-left">
              <h3 class="city-name">
                London <span aria-hidden="true">🇬🇧</span>
              </h3>
              <p class="subtext-city-date"></p>
            </div>
            <div class="city-card-right">
              <span class="city-time"></span>
              <span class="city-am-pm"></span>
            </div>
          </article>

          <article class="city-card" id="dublin-card" data-timezone="Europe/Dublin">
            <div class="city-card-left">
              <h3 class="city-name">
                Dublin <span aria-hidden="true">🇮🇪</span>
              </h3>
              <p class="subtext-city-date"></p>
            </div>
            <div class="city-card-right">
              <span class="city-time"></span>
              <span class="city-am-pm"></span>
            </div>
          </article>

          <article class="city-card" id="rhodes-card" data-timezone="Europe/Athens">
            <div class="city-card-left">
              <h3 class="city-name">
                Rhodes <span aria-hidden="true">🇬🇷</span>
              </h3>
              <p class="subtext-city-date"></p>
            </div>
            <div class="city-card-right">
              <span class="city-time"></span>
              <span class="city-am-pm"></span>
            </div>
          </article>
        </section>
      </main>
      <footer>
        This project was coded by
        <a
          href="https://www.shecodes.io/graduates/180037-hayley-walden"
          target="_blank"
          rel="noopener noreferrer"
          >Hayley Walden</a
        >, is open-sourced on
        <a
          href="https://github.com/chasemystatus"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
        and hosted by
        <a
          href="https://world-clock-73.netlify.app/"
          target="_blank"
          rel="noopener noreferrer"
          >Netlify</a
        >.
      </footer>
    </div>

    <script src="src/index.js" defer></script>
  </body>
</html>
